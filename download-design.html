<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Download Design | Imaginable Things</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#171717}
    .card{width:min(100%,560px);background:#fff;border:1px solid #e7e7e7;border-radius:22px;padding:30px;box-shadow:0 18px 55px rgba(0,0,0,.09)}
    .brand{font-size:.86rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
    h1{margin:0 0 10px;font-size:clamp(1.65rem,5vw,2.2rem)}p{line-height:1.55;color:#555}
    .file{margin:22px 0;padding:16px;background:#f4f5f7;border-radius:14px}.label{font-size:.78rem;color:#777;text-transform:uppercase;letter-spacing:.06em}.name{margin-top:6px;font-weight:800;overflow-wrap:anywhere}
    .btn{display:flex;width:100%;align-items:center;justify-content:center;text-decoration:none;background:#151515;color:#fff;border-radius:14px;padding:16px 18px;font-size:1rem;font-weight:800}
    .btn[aria-disabled=true]{pointer-events:none;opacity:.45}.status{margin-top:14px;font-size:.9rem;color:#666}.error{color:#a11}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Imaginable Things</div>
    <h1>Download Original Design</h1>
    <p>This is the original file uploaded with the quote request.</p>
    <div class="file"><div class="label">File</div><div id="fileName" class="name">Preparing…</div></div>
    <a id="downloadBtn" class="btn" href="#" aria-disabled="true">⬇ Download Original Design</a>
    <div id="status" class="status">Preparing secure download…</div>
  </main>
  <script>
    (()=>{
      const q=new URLSearchParams(location.search);
      const path=q.get('path');
      const name=q.get('name')||'Customer design';
      const fileName=document.getElementById('fileName');
      const button=document.getElementById('downloadBtn');
      const status=document.getElementById('status');
      fileName.textContent=name;
      if(!path){status.textContent='This download link is incomplete.';status.classList.add('error');return;}
      button.href='/api/quote-file?path='+encodeURIComponent(path);
      button.removeAttribute('aria-disabled');
      status.textContent='Secure file ready to download.';
    })();
  </script>
</body>
</html>
